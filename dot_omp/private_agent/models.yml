providers:
  corti:
    baseUrl: https://ai.eu.corti.app/v1
    apiKey: CORTI_BEARER
    api: openai-completions
    auth: apiKey
    models:
      - id: "corti-s1"
        name: "Corti S1"
        reasoning: true
        input: [text]
        contextWindow: 264000
        cost: { input: 2, output: 8, cacheRead: 0.200000, cacheWrite: 0 }
      - id: "corti-s1-instant"
        name: "Corti S1 Instant"
        reasoning: false
        input: [text]
        contextWindow: 264000
        cost: { input: 2, output: 8, cacheRead: 0.200000, cacheWrite: 0 }
      - id: "corti-s1-mini"
        name: "Corti S1 Mini"
        reasoning: true
        input: [text, image]
        contextWindow: 262144
        cost: { input: 1, output: 4, cacheRead: 0.100000, cacheWrite: 0 }
      - id: "corti-s1-mini-beta"
        name: "Corti S1 Mini Beta"
        reasoning: true
        input: [text, image]
        contextWindow: 262144
        cost: { input: 1, output: 4, cacheRead: 0.100000, cacheWrite: 0 }
      - id: "corti-s1-mini-instant"
        name: "Corti S1 Mini Instant"
        reasoning: false
        input: [text, image]
        contextWindow: 262144
      - id: "corti-s1-mini-instant-beta"
        name: "Corti S1 Mini Instant Beta"
        reasoning: false
        input: [text, image]
        contextWindow: 262144
        cost: { input: 1, output: 4, cacheRead: 0.200000, cacheWrite: 0 }
      - id: "corti-s1-tiny"
        name: "Corti S1 Tiny"
        reasoning: true
        input: [text]
        contextWindow: 32768
        cost: { input: 1, output: 4, cacheRead: 0.200000, cacheWrite: 0 }
      - id: "corti-s1-tiny-instant"
        name: "Corti S1 Tiny Instant"
        reasoning: false
        input: [text]
        contextWindow: 32768
        cost: { input: 1, output: 4, cacheRead: 0.200000, cacheWrite: 0 }
      - id: "corti-s1-embedding"
        name: "Corti S1 Embedding"
        reasoning: false
        input: [text]
        contextWindow: 16384
        cost: { input: 0.030000, output: 0, cacheRead: 0, cacheWrite: 0 } 

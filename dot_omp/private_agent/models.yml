providers:
  corti:
    baseUrl: https://ai.eu.corti.app/v1
    api: openai-completions
    apiKey: CORTI_BEARER
    models:
      - id: corti-s1
        name: Corti S1
        reasoning: true
        input: [text]
        contextWindow: 262144
        cost: { input: 2, output: 8, cacheRead: 0.2, cacheWrite: 0 }
        compat:
          reasoningEffortMap: { minimal: high, low: high, medium: high, high: high, xhigh: max, max: max }
      - id: corti-s1-instant
        name: Corti S1 Instant
        reasoning: false
        input: [text]
        contextWindow: 262144
        cost: { input: 2, output: 8, cacheRead: 0.2, cacheWrite: 0 }
      - id: corti-s1-mini
        name: Corti S1 Mini
        reasoning: true
        input: [text, image]
        contextWindow: 262144
        cost: { input: 1, output: 4, cacheRead: 0.1, cacheWrite: 0 }
        compat:
          supportsReasoningEffort: false
      - id: corti-s1-mini-instant
        name: Corti S1 Mini Instant
        reasoning: false
        input: [text, image]
        contextWindow: 262144
        cost: { input: 1, output: 4, cacheRead: 0.1, cacheWrite: 0 }
      - id: corti-s1-alpha-instant
        name: Corti S1 Alpha Instant
        reasoning: true
        input: [text, image]
        contextWindow: 1048576
        cost: { input: 2, output: 8, cacheRead: 0.2, cacheWrite: 0 }
        compat:
          supportsReasoningEffort: false

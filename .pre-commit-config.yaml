repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^chezmoi/manifests/(obsidian|iterm2|karabiner)/
      - id: end-of-file-fixer
        exclude: ^chezmoi/manifests/(obsidian|iterm2|karabiner)/|^chezmoi/dot_omp/private_agent/private_config\.yml\.tmpl$
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: ci-local
        name: lint checks (ci-local.sh)
        entry: scripts/ci-local.sh
        language: system
        pass_filenames: false
        always_run: true

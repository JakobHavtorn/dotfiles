# Machine identity — determines git author. The .chezmoi.toml.tmpl prompt
# sets .identity to "work" or "personal"; run_onchange_after_10-git-config
# reads .chezmoidata.identities[.identity] for name + email.
identities:
  work:
    name: "Jakob Havtorn"
    email: "jdh@corti.ai"
  personal:
    name: "Jakob Havtorn"
    email: "havtorn93@gmail.com"

# Non-secret shared facts. Available in templates as .chezmoidata.*

# Coding agent config — shared across opencode + omp + pi. Single source of truth
# for notion deny-list, MCP servers, corti model list.
coding_agents:
  # Canonical notion deny-list — union of all actions denied across opencode.jsonc
  # and private_config.yml. Each entry is an explicit notion tool suffix (without
  # the notion_ prefix). Hyphenated in canonical form; omp templates replace
  # hyphens with underscores.
  notion:
    deny_actions:
      - create-attachment
      - create-comment
      - create-database
      - create-file-upload
      - create-folder
      - create-pages
      - create-view
      - update-folder
      - update-view
      - update-data-source
      - duplicate-page
      - download-attachment
      - move-pages
      - get-comments
      - get-users
      - get-teams
      - get-session-status
      - list-favorite-pages
      - list-private-pages
      - list-recent-pages
      - list-shared-pages
      - list-session-events
      - query-meeting-notes
      - query-sessions
      - search-sessions
      - search-agents
      - spawn-session
      - stop-session
      - send-message-to-session
      - wait-session
      - read-session-event
      - notion-convert-page-to-skill
    # opencode supports wildcard actions; emit these in addition to the explicit
    # list (they subsume the create-* and list-* entries above).
    deny_wildcards:
      - create-*
      - list-*

  # MCP server definitions shared across opencode.jsonc and mcp.json.
  # Stores format-agnostic data; each template renders its own key names and
  # env-var syntax ({env:...} for opencode, ${...} for omp).
  mcp:
    servers:
      linear:
        url: "https://mcp.linear.app/mcp"
      slack:
        url: "https://mcp.slack.com/mcp"
        scope: "search:read.public search:read.private search:read.mpim search:read.im search:read.files files:read search:read.users chat:write users:read users:read.email channels:history groups:history mpim:history im:history"
        callback_port: 19876
        redirect_uri: "http://127.0.0.1:19876/mcp/oauth/callback"
        auth_token_url: "https://slack.com/api/oauth.v2.user.access"
      synapse:
        url: "https://mcp.synapse.corti.app/mcp"
        oauth_client_id: "synapse-mcp"
        oauth_scope: "openid email profile offline_access"
      notion:
        url: "https://mcp.notion.com/mcp"
      # Mintlify-hosted docs MCP — tools: search_corti_api_documentation,
      # query_docs_filesystem_corti_api_documentation. No auth.
      corti_docs:
        url: "https://docs.corti.ai/mcp"
      obsidian:
        url: "http://127.0.0.1:27123/mcp"

  # Corti model list — single source of truth for models.yml.tmpl,
  # opencode.jsonc, the Hermes config run script, and the pi config run script
  # (default model).
  corti:
    default_model: "corti-s1"
    models:
      - id: corti-s1
        name: "Corti S1"
        reasoning: true
        input: [text]
        context_length: 1048576
        cost: { input: 2, output: 8, cacheRead: 0.200000, cacheWrite: 0 }
      - id: corti-s1-alpha
        name: "Corti S1 Alpha"
        reasoning: true
        input: [text]
        context_length: 528000
        cost: { input: 2, output: 8, cacheRead: 0.200000, cacheWrite: 0 }
      - id: corti-s1-beta
        name: "Corti S1 Beta"
        reasoning: true
        input: [text]
        context_length: 528000
        cost: { input: 2, output: 8, cacheRead: 0.200000, cacheWrite: 0 }
      - id: corti-s1-instant
        name: "Corti S1 Instant"
        reasoning: false
        input: [text]
        context_length: 1048576
        cost: { input: 2, output: 8, cacheRead: 0.200000, cacheWrite: 0 }
      - id: corti-s1-mini
        name: "Corti S1 Mini"
        reasoning: true
        input: [text, image]
        context_length: 262144
        cost: { input: 1, output: 4, cacheRead: 0.100000, cacheWrite: 0 }
      - id: corti-s1-mini-beta
        name: "Corti S1 Mini Beta"
        reasoning: true
        input: [text, image]
        context_length: 262144
        cost: { input: 1, output: 4, cacheRead: 0.100000, cacheWrite: 0 }
      - id: corti-s1-mini-instant
        name: "Corti S1 Mini Instant"
        reasoning: false
        input: [text, image]
        context_length: 262144
        cost: { input: 1, output: 4, cacheRead: 0.100000, cacheWrite: 0 }
      - id: corti-s1-mini-instant-beta
        name: "Corti S1 Mini Instant Beta"
        reasoning: false
        input: [text, image]
        context_length: 262144
        cost: { input: 1, output: 4, cacheRead: 0.200000, cacheWrite: 0 }
      - id: corti-s1-embedding
        name: "Corti S1 Embedding"
        reasoning: false
        input: [text]
        context_length: 16384
        cost: { input: 0.030000, output: 0, cacheRead: 0, cacheWrite: 0 }

---
name: lint
on:
  push:
    branches: [main, "*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          for f in dot_config/opencode/cli.json; do
            python3 -c "import json; json.load(open('$f'))" && echo "  $f: valid"
          done

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          ignore_paths: .git

      - name: Verify set -euo pipefail in all scripts
        run: |
          for f in run_once_* run_onchange_* scripts/*.sh; do
            [[ -f "$f" ]] || continue
            grep -q 'set -euo pipefail' "$f" || {
              echo "MISSING 'set -euo pipefail': $f"
              exit 1
            }
          done
          echo "All scripts have 'set -euo pipefail'"

      - name: Install chezmoi
        run: |
          curl -fsLS get.chezmoi.io | sh
          install -m 755 bin/chezmoi /usr/local/bin/chezmoi

      - name: Render templates for all roles
        run: |
          for role in work personal remote; do
            echo "=== role=$role ==="
            mkdir -p "$HOME/.config/chezmoi"
            printf 'sourceDir = "%s"\n[data]\nrole = "%s"\n' "$GITHUB_WORKSPACE" "$role" > "$HOME/.config/chezmoi/chezmoi.toml"
            for f in $(find . -name '*.tmpl' -not -path './.git/*' -not -name '.chezmoi.toml.tmpl'); do
              chezmoi execute-template < "$f" > /dev/null 2>&1 || {
                echo "FAILED: $f (role=$role)"
                chezmoi execute-template < "$f"
                exit 1
              }
            done
          done
          echo "All templates rendered successfully for all roles"

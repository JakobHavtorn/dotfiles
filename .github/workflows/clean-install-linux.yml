---
name: clean-install-linux
on:
  push:
    branches: [main, "*"]
  pull_request:
  schedule:
    - cron: '0 10 * * 0'  # Sundays 10:00 UTC

jobs:
  clean-install:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git xz-utils

      - name: Install chezmoi
        run: |
          curl -fsLS get.chezmoi.io | sh
          install -m 755 bin/chezmoi /usr/local/bin/chezmoi

      - name: chezmoi apply (identity=work)
        run: |
          mkdir -p "$HOME/.config/chezmoi"
          printf 'sourceDir = "%s"\n[data]\nidentity = "work"\n' "$GITHUB_WORKSPACE" > "$HOME/.config/chezmoi/chezmoi.toml"
          chezmoi apply

      - name: Verify expected binaries
        run: |
          for bin in uv rg jq gh fish omp; do
            test -x "$HOME/.local/bin/$bin" || { echo "MISSING: $bin"; exit 1; }
            echo "  $bin: OK"
          done

      - name: chezmoi apply (idempotency check)
        run: |
          # Force scripts to re-run, then verify they're safe against installed state
          chezmoi state delete-bucket --bucket=scriptState
          chezmoi apply
          for bin in uv rg jq gh fish omp; do
            test -x "$HOME/.local/bin/$bin" || { echo "MISSING after re-run: $bin"; exit 1; }
            echo "  $bin: OK after re-run"
          done

      - name: Bootstrap completeness check
        if: github.event_name != 'schedule'
        run: bash scripts/check-bootstrap.sh || true

      - name: Bootstrap completeness check (hard-fatal)
        if: github.event_name == 'schedule'
        run: bash scripts/check-bootstrap.sh

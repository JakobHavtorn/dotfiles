---
name: clean-install-macos
on:
  pull_request:
  schedule:
    - cron: '0 10 * * 0'  # Sundays 10:00 UTC

jobs:
  clean-install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          curl -fsLS get.chezmoi.io | sh
          install -m 755 bin/chezmoi /usr/local/bin/chezmoi

      - name: chezmoi apply (role=work)
        run: |
          mkdir -p "$HOME/.config/chezmoi"
          printf 'sourceDir = "%s"\n[data]\nrole = "work"\n' "$GITHUB_WORKSPACE" > "$HOME/.config/chezmoi/chezmoi.toml"
          chezmoi apply

      - name: Verify fish
        run: fish -c 'echo ok'

      - name: Verify expected tools
        run: |
          for bin in fish go node tmux shellcheck shfmt yq tree wget pandoc parallel uv poetry htop rg jq gh ffmpeg sox argocd helm kubectx kubelogin omp; do
            command -v "$bin" || { echo "MISSING: $bin"; exit 1; }
            echo "  $bin: OK"
          done
          fish -c 'type -q omf' || { echo "MISSING: omf"; exit 1; }
          echo "  omf: OK"

      - name: chezmoi apply (idempotency check)
        run: |
          chezmoi state delete-bucket --bucket=scriptState
          chezmoi apply

      - name: Dump round-trip (idempotency)
        run: |
          # After apply, run dump.sh to regenerate manifests from observed state,
          # then check git diff is empty (dump is idempotent). brew bundle dump
          # may reorder lines or pick up CI-only packages — this is best-effort:
          # a non-empty diff is reported as a warning, not a hard failure.
          bash scripts/dump.sh || { echo "dump.sh failed"; exit 1; }
          if git diff --quiet chezmoi/manifests/; then
            echo "dump round-trip: manifests unchanged (idempotent)"
          else
            echo "::warning::dump.sh produced manifest drift — review the diff below"
            git diff chezmoi/manifests/
          fi

      - name: Bootstrap completeness check
        run: bash scripts/check-bootstrap.sh || true

  clean-install-scheduled:
    runs-on: macos-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          curl -fsLS get.chezmoi.io | sh
          install -m 755 bin/chezmoi /usr/local/bin/chezmoi

      - name: chezmoi apply (role=work)
        run: |
          mkdir -p "$HOME/.config/chezmoi"
          printf 'sourceDir = "%s"\n[data]\nrole = "work"\n' "$GITHUB_WORKSPACE" > "$HOME/.config/chezmoi/chezmoi.toml"
          chezmoi apply

      - name: Verify fish
        run: fish -c 'echo ok'

      - name: Verify expected tools
        run: |
          for bin in fish go node tmux shellcheck shfmt yq tree wget pandoc parallel uv poetry htop rg jq gh ffmpeg sox argocd helm kubectx kubelogin omp; do
            command -v "$bin" || { echo "MISSING: $bin"; exit 1; }
            echo "  $bin: OK"
          done
          fish -c 'type -q omf' || { echo "MISSING: omf"; exit 1; }
          echo "  omf: OK"

      - name: chezmoi apply (idempotency check)
        run: |
          chezmoi state delete-bucket --bucket=scriptState
          chezmoi apply

      - name: Dump round-trip (idempotency, hard-fatal)
        run: |
          # Scheduled run: dump drift is a hard failure — silently rotting
          # manifests mean the dump/install cycle is broken.
          bash scripts/dump.sh || { echo "dump.sh failed"; exit 1; }
          git diff --exit-code chezmoi/manifests/

      - name: Bootstrap completeness check (hard-fatal)
        run: bash scripts/check-bootstrap.sh
